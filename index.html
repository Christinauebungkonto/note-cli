<body style="font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem;">
  <h1>note-cli</h1>
  <p>Notizen speichern, auflisten und löschen, direkt im Terminal.</p>
  <pre>./note add Milch kaufen
./note list
./note delete &lt;hash&gt;</pre>
  <p>Jede Notiz liegt als Textdatei unter <code>.notes/db/</code>; der Dateiname ist der SHA-Hash des Inhalts.</p>
</body>
</html>
